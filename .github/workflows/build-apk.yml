name: Gerar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Aceitar licenças do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk SrMattaTreino.apk

      - name: Mostrar tamanho
        run: ls -lh SrMattaTreino.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SrMattaTreino-apk
          path: SrMattaTreino.apk

      # Link direto para baixar o APK pelo celular: aba "Releases" do repositório.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SrMatta Treino (build ${{ github.run_number }})
          files: SrMattaTreino.apk
